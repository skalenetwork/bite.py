name: Build and publish

permissions:
  contents: read

on:
  pull_request:
    types: [closed]
    branches: ["main", "develop", "beta"]

jobs:
  version:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.merged
    outputs:
      version: ${{ steps.versioning.outputs.version }}
      release_tag: ${{ steps.versioning.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Calculate version
        id: versioning
        run: |
          export BRANCH=${{ github.event.pull_request.base.ref }}
          VERSION=$(bash ./scripts/calculate_version.sh)
          RELEASE_TAG="v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: ubuntu-22
          - os: ubuntu-24.04
            artifact_name: ubuntu-24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set package version
        run: |
          sed -i "s/^version = \".*\"$/version = \"${{ needs.version.outputs.version }}\"/" pyproject.toml
          grep '^version = ' pyproject.toml

      - name: Build distributions
        run: bash scripts/build_packages.sh

      - name: Validate distributions
        run: |
          uvx twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist-${{ matrix.artifact_name }}
          path: dist/*

  publish:
    runs-on: ubuntu-24.04
    needs: [version, build]
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download Ubuntu 24 distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist-ubuntu-24
          path: dist

      - name: Download Ubuntu 22 distributions for release
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist-ubuntu-22
          path: dist-ubuntu-22

      - name: Validate distributions
        run: |
          uvx twine check dist/* dist-ubuntu-22/*

      - name: Publish to PyPI
        run: |
          echo "Uploading to pypi"
          uv publish dist/*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.release_tag }}
          name: ${{ needs.version.outputs.release_tag }}
          generate_release_notes: true
          files: |
            dist/*
            dist-ubuntu-22/*
